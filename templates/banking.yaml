id: banking
name:
    de: Banking & Bezahlen
    en: Banking & payments
description:
    de: 'Sparkassen, Volks- und Raiffeisenbanken, Deutsche Bank, Commerzbank, ING, DKB, comdirect, N26, Postbank, Consorsbank, HVB, Targobank, Santander, Trade Republic, Scalable, PayPal, Klarna. Tipp: auf einen festen Uplink oder Direkt legen – Banken reagieren auf wechselnde IPs oft mit Sperren oder Nachfragen.'
    en: 'Savings banks (Sparkassen), cooperative banks, Deutsche Bank, Commerzbank, ING, DKB, comdirect, N26, Postbank, Consorsbank, HVB, Targobank, Santander, Trade Republic, Scalable, PayPal, Klarna. Tip: pin it to one fixed uplink or Direct – banks often block or challenge changing IPs.'
