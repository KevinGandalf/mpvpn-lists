id: mail-cloud
name:
    de: Mail & Cloud
    en: Mail & cloud
description:
    de: Gmail, Outlook/Microsoft 365, iCloud, GMX, WEB.DE, Proton, Tuta, Posteo, mailbox.org, Yahoo und weitere Mail-Anbieter sowie Cloud-Speicher wie Dropbox, MEGA, pCloud, Box.
    en: Gmail, Outlook/Microsoft 365, iCloud, GMX, WEB.DE, Proton, Tuta, Posteo, mailbox.org, Yahoo and more mail providers plus cloud storage such as Dropbox, MEGA, pCloud, Box.
priority: 0
services:
-   id: google-gmail-drive-docs
    name: Google (Gmail, Drive, Docs)
    domains:
    - '**.mail.google.com'
    - '**.drive.google.com'
    - '**.docs.google.com'
    - '**.googleusercontent.com'
    - '**.accounts.google.com'
